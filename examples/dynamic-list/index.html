<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>rfw dynamic list example</title>
    </head>
    <body>
        <div id="app"></div>
        <script src="/rfw_config.js"></script>
        <script src="/wasm_exec.js"></script>
        <script src="/wasm_loader.js"></script>
        <script>
            const go = new Go();
            const wasmVersion = window.RFW_WASM_VERSION;
            const wasmURL = wasmVersion
                ? `/app.wasm?v=${encodeURIComponent(wasmVersion)}`
                : "/app.wasm";
            WasmLoader.load(wasmURL, {
                go: go,
                color: "#ff0000",
                height: "4px",
                blur: "4px",
            });
        </script>
    </body>
</html>
