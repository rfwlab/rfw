name: Test

on:
  push:
    branches: ["main"]
    tags: [ 'v*' ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vanilla-os/pico:main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Application
        run: go build -o rfw -ldflags="-X 'github.com/rfwlab/rfw/v2/core.version=${{ github.sha }}'" ./cmd/rfw/main.go

      - name: Calculate and Save Checksums
        run: sha256sum rfw > checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfw-build
          path: |
            rfw
            checksums.txt

  wasm:
    name: Test (js/wasm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Build for js/wasm
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Vet for js/wasm
        run: GOOS=js GOARCH=wasm go vet ./...

      - name: Install wasmbrowsertest
        run: go install github.com/agnivade/wasmbrowsertest@v0.11.0

      - name: Allow Chrome sandbox (Ubuntu 24 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Wrap Chrome with --no-sandbox for chromedp
        run: |
          real="$(readlink -f /usr/bin/google-chrome)"
          sudo rm /usr/bin/google-chrome
          printf '#!/bin/sh\nexec %s --no-sandbox "$@"\n' "$real" | sudo tee /usr/bin/google-chrome > /dev/null
          sudo chmod +x /usr/bin/google-chrome
          google-chrome --version

      # chromedp allows Chrome 20s to publish its DevTools websocket, and a
      # cold runner does not always make it: the binary and its first profile
      # are paged in on the initial launch, so whichever package runs first
      # fails the job before a single test has run. Pay that cost once here.
      - name: Warm up Chrome
        run: google-chrome --headless=new --disable-gpu --dump-dom about:blank > /dev/null

      # wasm_exec.js forwards the whole environment to the wasm process and
      # Go's js runtime caps argv+env; the runner env is huge, so trim it.
      # The -exec wrapper retries a single package whose browser handshake timed
      # out, so an unrelated package's real failure is never re-run.
      - name: Run wasm tests in headless Chrome
        run: |
          exec env -i HOME="$HOME" PATH="$PATH" \
            WASMBROWSERTEST="$(go env GOPATH)/bin/wasmbrowsertest" \
            GOOS=js GOARCH=wasm go test -p=1 \
            -exec "$PWD/.github/scripts/wasmbrowsertest-retry" ./...

  scan:
    name: EUProvGuard Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download euprovguard
        run: |
          curl -fsSL https://github.com/fabricatorsltd/euprovguard/releases/download/v1.1.0/euprovguard-linux-amd64 -o euprovguard
          echo "e936f5a70e8c5e027214f6a41dd6f99bc6e823395ab85f18abefd253df4a3f78  euprovguard" | sha256sum -c -
          chmod +x euprovguard

      - name: Run EUProvGuard Scan
        run: |
          ./euprovguard -path . -bundle compliance-report > scan.log 2>&1
          cat scan.log

      - name: Check for CVEs
        run: |
          if grep -q "CVEs: [1-9]" scan.log; then
            echo "::error::CVEs found by EUProvGuard - release blocked"
            exit 1
          fi
          echo "No CVEs found - safe to release"

      - name: Upload Compliance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: compliance-report.*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, wasm, scan, lint, secret-scan]
    permissions:
      contents: write
    container:
      image: ghcr.io/vanilla-os/pico:main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Build release assets
        run: |
          mkdir release
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="release/rfw-${goos}-${goarch}"
            if [ "$goos" = windows ]; then
              output="${output}.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "$output" \
              -ldflags="-s -w -X 'github.com/rfwlab/rfw/v2/core.version=${{ github.ref_name }}'" \
              ./cmd/rfw/main.go
          done

      - name: Calculate and Save Checksums
        run: |
          cd release
          sha256sum rfw-* > checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfw-release-build
          path: |
            release/*

      - name: Download Compliance Reports
        uses: actions/download-artifact@v4
        with:
          name: compliance-reports
          path: compliance/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            compliance/*

  # Static analysis (Fabricators standard, see fab/infra code-quality). golangci-lint
  # runs native and GOOS=js GOARCH=wasm so the //go:build js && wasm components are
  # analysed before release.
  lint:
    name: golangci (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: native, goos: linux, goarch: amd64 }
          - { name: wasm, goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --output.text.path=stdout --output.sarif.path=golangci-${{ matrix.name }}.sarif
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golangci-sarif-${{ matrix.name }}
          path: golangci-${{ matrix.name }}.sarif
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            ghcr.io/trufflesecurity/trufflehog:3.96.0 \
            git file:///repo/ \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown
