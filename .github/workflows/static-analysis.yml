name: static-analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # golangci-lint runs twice: native, and GOOS=js GOARCH=wasm so the
  # //go:build js && wasm components (the browser/WASM side of rfw) are analysed too.
  go:
    name: golangci (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: native, goos: linux, goarch: amd64 }
          - { name: wasm, goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
